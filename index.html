<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Prancheta da Marmoraria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EDF0EF; --panel:#FFFFFF; --panel2:#F2F5F4; --ink:#1B2226; --muted:#66717A; --line:#E1E6E4;
  --accent:#1A63A0; --accent-ink:#FFFFFF; --accent-soft:#E4EEF7;
  --canvas:#FAFBFA; --grid-minor:#EEF2F0; --grid-major:#D9E0DD;
  --cut:#C0432B; --good:#1E7A4A;
  --shadow:0 1px 2px rgba(27,34,38,.06),0 8px 24px rgba(27,34,38,.08);
  --display:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121618; --panel:#191E21; --panel2:#21272A; --ink:#E6EAE8; --muted:#9BA4A8; --line:#2C3438;
  --accent:#6AAEE0; --accent-ink:#0D1A24; --accent-soft:#1B3142;
  --canvas:#101416; --grid-minor:#1A2023; --grid-major:#273033;
  --cut:#E57B62; --good:#6CC18F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:14px 18px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:16px;height:16px;border-radius:2px;background:linear-gradient(135deg,#2B2B2E 0 50%,#E6E2D8 50% 100%);border:1px solid var(--line)}
.proj{flex:1 1 200px;min-width:0;border:1px solid transparent;background:transparent;padding:5px 8px;border-radius:6px;font-weight:600;font-size:15px}
.proj:hover,.proj:focus{border-color:var(--line);background:var(--panel2);outline:none}
.themebtn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer;color:var(--ink);flex:none}
.themebtn:hover{background:var(--panel2)}
.themebtn svg{width:18px;height:18px}
.newdef{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=number],input[type=tel],input[type=search]{background:var(--panel2);border:1px solid transparent;border-radius:9px;padding:7px 9px;min-width:0}
select:hover,input[type=text]:hover,input[type=number]:hover,input[type=tel]:hover,input[type=search]:hover{border-color:var(--line)}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.totals{display:flex;align-items:baseline;gap:14px;margin-left:auto;font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--display);font-weight:700;font-size:24px;line-height:1;letter-spacing:-.02em}
.totals .big small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.totals .money{font-family:var(--display);font-weight:700;font-size:18px;color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent);padding:5px 10px;border-radius:999px}

/* main */
.main{display:grid;grid-template-columns:56px minmax(0,1fr) 370px;min-height:0}
.tools{display:flex;flex-direction:column;gap:4px;padding:10px 7px;background:var(--panel);border-right:1px solid var(--line)}
.tool{width:42px;height:42px;display:grid;place-items:center;border:1px solid transparent;border-radius:12px;background:transparent;cursor:pointer;position:relative;color:var(--ink);flex:none}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tool svg{width:22px;height:22px}
.tool svg,.themebtn svg,.polypad svg{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.polypad button svg{width:18px;height:18px;vertical-align:middle}
.themebtn .sun,:root[data-theme="dark"] .themebtn .moon{display:none}
:root[data-theme="dark"] .themebtn .sun{display:inline}
.tool.del{color:var(--cut)}
.tool:disabled{opacity:.3;cursor:default}
.tool:disabled:hover{background:transparent}
.genbox{display:flex;flex-direction:column;gap:10px;margin-top:16px;padding:12px;border-radius:14px;background:var(--panel2)}
.genh{display:flex;flex-wrap:wrap;gap:8px 14px}
.genh .genlen{justify-content:flex-start}
.genh .genlen input{width:58px}
.edges{display:flex;flex-direction:column;gap:3px}
.edge{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:3px 4px;border-radius:8px}
.edge:hover,.edge.hl{background:var(--panel)}
.edge .en{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:600 11.5px var(--mono)}
.edge .el{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edge .el small{font:500 11.5px var(--mono);color:var(--muted);margin-left:6px}
.edge .tg{padding:6px 10px;background:var(--panel);justify-content:center;min-width:70px}
.edge .tg[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.genlen{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.genlen .gen{background:var(--panel)}
.genlen input{width:90px;text-transform:none;letter-spacing:0}
.tool kbd{position:absolute;right:3px;bottom:1px;font:500 9px var(--mono);opacity:.6}
.sep{height:1px;background:var(--line);margin:6px 4px;flex:none}

.stage{position:relative;min-width:0;min-height:0;background:var(--canvas);overflow:hidden}
#cv{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#cv text{font-family:var(--mono)}
#cv .nm{font-family:var(--display);font-weight:600}
.stage[data-tool="rect"] #cv,.stage[data-tool="poly"] #cv,.stage[data-tool="cut"] #cv{cursor:crosshair}
.hud{position:absolute;left:12px;bottom:12px;right:140px;font-size:12.5px;color:var(--muted);pointer-events:none;text-wrap:balance}
.hud b{color:var(--ink);font-weight:600}
.hud .buf{font-family:var(--mono);background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:4px;margin-left:4px}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.zoom button{border:0;background:transparent;border-radius:6px;padding:4px 9px;cursor:pointer;font-weight:600}
.zoom button:hover{background:var(--panel2)}
.zoom span{font:500 11px var(--mono);color:var(--muted);align-self:center;min-width:48px;text-align:center}

/* side */
.side{background:var(--panel);border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;min-height:0}
.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec h2{font-family:var(--display);font-weight:600;font-size:15px;color:var(--ink);margin:0 0 12px}
.hint{color:var(--muted);margin:0;font-size:13px}
.hint kbd,.hud kbd{font:500 11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel2);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fields label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:500;min-width:0}
.fields label.full{grid-column:1/-1}
.fields input,.fields select{font-size:14px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);width:100%}
.metrics{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0 4px;font-variant-numeric:tabular-nums}
.metric{display:flex;flex-direction:column}
.metric span{font-size:12.5px;color:var(--muted);font-weight:500}
.metric b{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.metric b small{font-size:13px;color:var(--muted);margin-left:2px}
.cutlist{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--cut)}
.btn.warn{background:var(--cut);color:#fff;border-color:var(--cut)}
.gen{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel2)}
.gen .btn{border:0;border-radius:0}
.gen input{width:48px;border:0;border-left:1px solid var(--line);border-radius:0;padding:6px 4px;text-align:right;background:transparent}
.gen em{font-style:normal;font-size:12px;color:var(--muted);padding:0 8px 0 3px}

.tabs{display:flex;gap:2px;padding:10px 16px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.tab{border:0;background:transparent;padding:9px 12px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--tc);border-bottom-color:var(--tc);background:var(--tb)}
/* each tab has its own colour: a dot on the tab, the tint behind its content */
.tab{border-radius:10px 10px 0 0;white-space:nowrap;padding-inline:8px;font-size:14px}
.tabs{padding-inline:8px;gap:0;overflow-x:auto;scrollbar-width:none;flex:none}
.tab::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:6px;vertical-align:1px}
.tab[data-tab=clientes],.side[data-tab=clientes]{--tc:#1A63A0;--tb:#EDF4FB}
.tab[data-tab=resumo],.side[data-tab=resumo]{--tc:#1E7A4A;--tb:#EDF7F1}
.tab[data-tab=pecas],.side[data-tab=pecas]{--tc:#A86400;--tb:#FCF3E4}
.tab[data-tab=materiais],.side[data-tab=materiais]{--tc:#7A4FB0;--tb:#F4EFFA}
:root[data-theme=dark] .tab[data-tab=clientes],:root[data-theme=dark] .side[data-tab=clientes]{--tc:#6AAEE0;--tb:#15253A}
:root[data-theme=dark] .tab[data-tab=resumo],:root[data-theme=dark] .side[data-tab=resumo]{--tc:#6CC18F;--tb:#13291F}
:root[data-theme=dark] .tab[data-tab=pecas],:root[data-theme=dark] .side[data-tab=pecas]{--tc:#E3A955;--tb:#2D2313}
:root[data-theme=dark] .tab[data-tab=materiais],:root[data-theme=dark] .side[data-tab=materiais]{--tc:#B894E8;--tb:#231B33}
.side .tabbody{background:var(--tb);--panel2:var(--panel)}
.tab:focus-visible{outline:2px solid var(--accent)}
.tabbody{padding:14px 16px;display:flex;flex-direction:column;gap:18px;flex:1}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:0 6px 6px 0;border-bottom:1px solid var(--line)}
td{padding:6px 6px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-size:12.5px;padding-right:0;padding-left:6px}
th.n{font-family:var(--ui)}
tfoot td{font-weight:600;border-bottom:0}
.sw{display:inline-block;width:12px;height:12px;border-radius:2px;border:1px solid var(--line);vertical-align:-1px;margin-right:6px}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--panel2)}
tr.row.on td{background:var(--accent-soft)}
.blk h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 8px}
.grand{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 16px;border-radius:14px;background:var(--panel2);font-variant-numeric:tabular-nums}
.grand span{color:var(--muted)}
.grand b{font-family:var(--mono);font-weight:500;text-align:right}
.grand .t{font-family:var(--display);font-size:24px;font-weight:700;color:var(--good);letter-spacing:-.02em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.check{display:flex;gap:8px;align-items:center;grid-column:1/-1;font-size:13px}
.mat{display:grid;grid-template-columns:32px 1fr 92px 30px;gap:6px;align-items:center}
.mat input[type=color]{width:32px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.mat .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;border-radius:6px;height:30px}
.mat .x:hover{color:var(--cut);background:var(--panel2)}
.addform{display:grid;grid-template-columns:1.3fr 1fr 1fr .7fr;gap:6px;align-items:end}
.addform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.addform input,.addform select{width:100%;font-size:13.5px}
.addform .btn{grid-column:1/-1;justify-content:center}
.foot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--panel)}
.empty{color:var(--muted);font-size:13px}
.search{width:100%;margin-bottom:8px}
tr.row td .x{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;padding:4px 8px;font:inherit}
tr.row td .x:hover{color:var(--cut);background:var(--panel2)}
tr.row td .x.warn{background:var(--cut);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* desktop-hidden mobile pieces */
.sheethead{display:none}
#mobDefs{display:none}
.polypad{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center}
.polypad[hidden]{display:none}
.polypad input{width:96px;font-size:16px;padding:7px 8px}
.polypad button{min-width:40px;height:38px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;cursor:pointer;font-weight:600;font-size:16px;padding:0 10px}
.polypad button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:14px}
.polypad button.txt{font-size:14px;font-weight:500}
.polypad .angs{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.polypad .angs span{font-size:12.5px;color:var(--muted);font-weight:500;align-self:center;padding:0 6px}
.polypad .angs button{border:0;background:transparent;height:32px;min-width:0;font-size:13.5px;font-weight:600;padding:0 9px}
.polypad .angs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.polypad .pbreak{flex-basis:100%;height:0}
.polypad button:disabled,.polypad input:disabled{opacity:.35;cursor:default}

@media (max-width:900px){
  html,body{overflow:hidden;overscroll-behavior:none}
  .app{height:100%}
  .top{padding:8px 16px;gap:10px;flex-wrap:nowrap}
  .brand{display:none}
  .top .newdef{display:none}
  .proj{font-size:16px;padding:6px 8px;flex:1 1 auto;width:0}
  .totals .money{padding:3px 8px}
  .totals{margin-left:0;gap:8px;flex:none;flex-direction:column;align-items:flex-end;gap:2px}
  .totals .lbl{display:none}
  .totals .big{font-size:20px}
  .totals .money{font-size:14px}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;position:relative}
  .stage{grid-row:1;height:auto;min-height:0}
  .tools{grid-row:2;flex-direction:row;justify-content:space-between;border-right:0;border-top:1px solid var(--line);padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px));overflow-x:auto;z-index:6}
  .tools{gap:0}
  .tool{width:42px;height:48px}
  .tool kbd{display:none}
  .sep{width:1px;height:auto;margin:6px 2px}
  .hud{top:10px;bottom:auto;left:12px;right:128px;font-size:12px;line-height:1.35}
  .hud kbd{display:none}
  .zoom{top:8px;bottom:auto;right:12px}
  .zoom button{padding:6px 11px;font-size:16px}
  .polypad{top:auto;bottom:calc(var(--peek) + 12px)}
  .side{--peek:58px;position:absolute;left:0;right:0;bottom:var(--toolsH,62px);height:var(--sheetH,58px);z-index:5;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -8px 28px rgba(0,0,0,.16);overflow:auto;overscroll-behavior:contain;transition:height .22s ease}
  .stage{--peek:58px}
  .sheethead{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;border:0;background:var(--panel);padding:8px 16px 10px;position:sticky;top:0;z-index:3;cursor:pointer;text-align:left;touch-action:none;border-bottom:1px solid var(--line);min-height:58px}
  .sheethead .grab{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--line)}
  .sheethead .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
  .sheethead b{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sheethead span.v{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
  .tabs{top:58px}
  #mobDefs{display:block}
  #mobDefs .newdef{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  #mobDefs .newdef .lbl{grid-column:1/-1}
  select,input[type=text],input[type=number],input[type=tel],input[type=search]{font-size:16px;padding:8px 9px}
  .btn{padding:9px 12px}
  .tab{padding:10px 7px}
  .foot{position:static}
  .toast{bottom:calc(130px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);text-align:center}
  .gen input{width:56px}
  .mat{grid-template-columns:40px 1fr 96px 36px}
  .mat input[type=color]{width:40px;height:40px}
  .addform{grid-template-columns:1fr 1fr}
  .addform label:first-child{grid-column:1/-1}
  tr.row td{padding-block:9px}
}
@media (max-width:900px) and (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>Prancheta</div>
    <input class="proj" id="projName" type="text" placeholder="Nome do cliente / obra" aria-label="Nome do cliente ou da obra">
    <div class="newdef" id="newdef">
      <span class="lbl">Novas peças</span>
      <select id="defType" aria-label="Tipo das novas peças"></select>
      <select id="defMat" aria-label="Material das novas peças"></select>
    </div>
    <div class="totals" id="totals"></div>
    <button class="themebtn" id="themeBtn" aria-label="Alternar tema claro / escuro" title="Tema claro / escuro"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="moon" d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a6.6 6.6 0 0 0 11 11z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></g></svg></button>
  </header>

  <div class="main">
    <nav class="tools" aria-label="Ferramentas">

<script>
(()=>{
const TYPES=['Bancada','Ilha','Saia','Frontão','Rodapé','Soleira','Peitoril','Lavatório','Nicho','Degrau','Espelho','Prateleira','Outro'];
const LINEAR=new Set(['Saia','Frontão','Rodapé','Soleira','Peitoril','Degrau','Espelho']);
const CUT_NAMES=['Cuba','Cooktop','Torneira','Tomada','Ralo','Furo'];
const KEY='prancheta-marmoraria-v1';
// installed app (outside Claude): manifest, offline cache, and ask the phone not to clear our storage
if(!window.claude&&(location.protocol==='https:'||location.hostname==='localhost')){
  document.head.append(Object.assign(document.createElement('link'),{rel:'manifest',href:'manifest.webmanifest'}));
  navigator.serviceWorker?.register('sw.js').catch(()=>{});navigator.storage?.persist?.();
}
try{if(localStorage.getItem('prancheta-tema')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}
document.getElementById('themeBtn').onclick=()=>{const d=document.documentElement,t=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=t;try{localStorage.setItem('prancheta-tema',t)}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>'R$ '+f2(n);
const fcm=n=>(Math.round(n*10)/10).toLocaleString('pt-BR');
const r1=n=>Math.round(n*10)/10;

function sample(){
  const m1=uid(),m2=uid(),m3=uid();const bp=uid(),lv=uid();
  return {
    name:'Exemplo — Cozinha e banheiro, Apto 302',
    materials:[
      {id:m2,name:'Preto São Gabriel',color:'#2B2B2E',price:520},
      {id:m1,name:'Branco Itaúnas',color:'#E4E0D5',price:450},
      {id:m3,name:'Verde Ubatuba',color:'#34443A',price:480},
    ],
    lossPct:0,cutPrice:80,discountCuts:false,snap:1,defType:'Bancada',defMat:m2,saiaH:4,frontH:10,
    shapes:[
      {id:bp,kind:'poly',name:'Bancada pia (L)',type:'Bancada',material:m2,qty:1,pts:[[0,0],[260,0],[260,60],[60,60],[60,180],[0,180]]},
      {id:uid(),kind:'cut',name:'Cuba',x:130,y:10,w:56,h:40},
      {id:uid(),kind:'cut',name:'Cooktop',x:8,y:92,w:45,h:52},
      {id:uid(),parent:bp,kind:'rect',name:'Frontão pia',type:'Frontão',material:m2,qty:1,x:0,y:-16,w:260,h:10},
      {id:uid(),parent:bp,kind:'rect',name:'Saia frontal',type:'Saia',material:m2,qty:1,x:0,y:196,w:260,h:4},
      {id:uid(),parent:bp,kind:'rect',name:'Saia lateral',type:'Saia',material:m2,qty:1,x:0,y:206,w:180,h:4},
      {id:lv,kind:'rect',name:'Lavatório',type:'Lavatório',material:m1,qty:1,x:330,y:0,w:120,h:50},
      {id:uid(),kind:'cut',name:'Cuba',x:370,y:10,w:40,h:30},
      {id:uid(),parent:lv,kind:'rect',name:'Saia lavatório',type:'Saia',material:m1,qty:1,x:330,y:56,w:120,h:10},
      {id:uid(),kind:'rect',name:'Soleira portas',type:'Soleira',material:m3,qty:3,x:330,y:100,w:80,h:15},
      {id:uid(),kind:'rect',name:'Peitoril janela',type:'Peitoril',material:m3,qty:1,x:330,y:125,w:150,h:18},
    ]
  };
}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.shapes&&o.materials)return o}}catch(e){}return null}
const LKEY='prancheta-orcamentos';
const localList=()=>{try{return JSON.parse(localStorage.getItem(LKEY))||{}}catch(e){return{}}};
let db=null,cloud=null,cloudQ=Promise.resolve(),lastSync=0,syncErr='';
function body(){const c=calc();return{nome:S.name||'Sem nome',tel:S.tel||'',end:S.end||'',atualizado:Date.now(),total:c.total,m2:c.m2l,estado:JSON.stringify(S)}}
function saveNow(){
  saveT=null;const b=body();
  try{localStorage.setItem(KEY,JSON.stringify(S));const l=localList();l[S.id]=b;localStorage.setItem(LKEY,JSON.stringify(l))}catch(e){}
  pushCloud(S.id,b);
}
function pushCloud(id,b){if(!db)return;cloudQ=cloudQ.then(()=>db.doc('orcamentos/'+id).set(b)).then(()=>{lastSync=Date.now();syncErr='';renderSync()},e=>{syncErr=e.code||'erro';renderSync()})}
let saveT=null;function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,800)}
function flush(){if(saveT){clearTimeout(saveT);saveNow()}}
// every saved budget, newest first: the cloud list when it is available, else this device's list
function lista(){return(cloud||Object.entries(localList()).map(([id,b])=>({id,...b}))).slice().sort((a,b)=>b.atualizado-a.atualizado)}
window.claude?.use?.('db').then(d=>{if(!d)return;db=d;
  let first=true;
  db.collection('orcamentos').orderBy('atualizado','desc').limit(1000).onSnapshot(q=>{
    cloud=q.docs.map(x=>({id:x.id,...x.data()}));
    if(first&&!q.metadata.fromCache){first=false;const l=localList(),byId=Object.fromEntries(cloud.map(b=>[b.id,b]));
      // send up what only this device has (or has newer); take the newer cloud copy of the open budget
      for(const[id,b]of Object.entries(l))if(!byId[id]||byId[id].atualizado<b.atualizado)pushCloud(id,b);
      const c=byId[S.id];if(c&&!saveT&&(!l[S.id]||c.atualizado>l[S.id].atualizado)){try{const o=JSON.parse(c.estado);if(o.shapes){S=o;undoStack=[];selId=null;multi.clear();try{localStorage.setItem(KEY,c.estado)}catch(e){}renderDefaults();renderAll();fit()}}catch(e){}}}
    renderLista();renderSync()},()=>{cloud=null;db=null;renderSync()});
});
let S=load()||sample();if(!S.id)S.id=uid();
let view={x:-40,y:-40,scale:2};
let tool='select',selId=null,tab='resumo';
let undoStack=[];
let draft={pts:[],cursor:null,typed:''};
let cursorCm=null;
let snapGuide=null,hoverPt=null,penSeen=false,penDown=false;
const angStep=()=>S.angStep??90; // 0 = livre
const freeOf=e=>e.shiftKey||(e.buttons&2)===2; // Shift, or the S Pen side button
const mqM=matchMedia('(max-width:900px)');
const isMob=()=>mqM.matches;
const coarse=()=>matchMedia('(pointer:coarse)').matches;
let sheet='peek',lastSel=null;

let multi=new Set();
const group=()=>multi.size?[...multi]:(selId?[selId]:[]);
function setGroup(ids){ids=[...new Set(ids)].filter(byId);multi=new Set(ids.length>1?ids:[]);selId=ids.length===1?ids[0]:null;renderAll()}
function toggleIn(id){const g=new Set(group());g.has(id)?g.delete(id):g.add(id);setGroup([...g])}
// move a set of shapes together; pieces bring the cutouts inside them
const kidsOf=p=>pieces().filter(o=>o.parent===p.id&&!o.solto);
function groupOf(id){const s=byId(id);if(!s||s.kind==='cut')return[id];const r=s.parent&&!s.solto&&byId(s.parent)||s;return[r.id,...kidsOf(r).map(k=>k.id)]}
function startGroupMove(p,ids){
  ids=[...new Set(ids.flatMap(groupOf))];const all=new Set(ids);for(const id of ids){const sh=byId(id);if(sh&&sh.kind!=='cut')for(const c of cutsOf(sh))all.add(c.id)}
  pushUndo();mode='move';drag={start:p,orig:[...all].map(id=>clone(byId(id))),moved:false};
}
function snapshot(){return JSON.stringify({shapes:S.shapes,materials:S.materials})}
function pushUndo(snap){undoStack.push(snap||snapshot());if(undoStack.length>100)undoStack.shift()}
function undo(){const s=undoStack.pop();if(!s){toast('Nada para desfazer');return}const o=JSON.parse(s);S.shapes=o.shapes;S.materials=o.materials;if(!byId(selId))selId=null;multi=new Set([...multi].filter(byId));if(multi.size<2){if(multi.size)selId=[...multi][0];multi.clear()}renderAll();save()}

/* ---------- geometry ---------- */
const byId=id=>S.shapes.find(s=>s.id===id);
const matOf=s=>S.materials.find(m=>m.id===s.material)||{name:'Sem material',color:'#9AA0A3',price:0,id:''};
const pieces=()=>S.shapes.filter(s=>s.kind!=='cut');
const cuts=()=>S.shapes.filter(s=>s.kind==='cut');
function bbox(s){
  if(s.kind==='poly'){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of s.pts){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return{x0,y0,x1,y1,w:x1-x0,h:y1-y0}}
  return{x0:s.x,y0:s.y,x1:s.x+s.w,y1:s.y+s.h,w:s.w,h:s.h};
}
function ptsOf(s){if(s.kind==='poly')return s.pts;return[[s.x,s.y],[s.x+s.w,s.y],[s.x+s.w,s.y+s.h],[s.x,s.y+s.h]]}
function signedArea(p){let a=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];a+=x1*y2-x2*y1}return a/2}
function areaCm(s){return s.kind==='poly'?Math.abs(signedArea(s.pts)):s.w*s.h}
function linLen(s){if(s.kind!=='poly')return Math.max(s.w,s.h);let m=0;const p=s.pts;for(let i=0;i<p.length;i++){const a=p[i],c=p[(i+1)%p.length];m=Math.max(m,Math.hypot(c[0]-a[0],c[1]-a[1]))}return m}
// size shown in lists/exports: rectangles and 4-corner strips by their sides, L/U by bounding box
function sizeOf(s){
  if(s.kind==='rect')return{w:s.w,h:s.h,f:'Retângulo'};
  const p=s.pts;if(p.length===4){const l=i=>Math.hypot(p[(i+1)%4][0]-p[i][0],p[(i+1)%4][1]-p[i][1]);const ax=p.every((a,i)=>{const c=p[(i+1)%4];return Math.abs(a[0]-c[0])<1e-6||Math.abs(a[1]-c[1])<1e-6});return{w:l(0),h:l(1),f:ax?'Retângulo':'Inclinada'}}
  const b=bbox(s);return{w:b.w,h:b.h,f:'L/U'};
}
function perim(s){const p=ptsOf(s);let l=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];l+=Math.hypot(b[0]-a[0],b[1]-a[1])}return l}
function pip(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const[xi,yi]=p[i],[xj,yj]=p[j];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}
function contains(s,x,y){if(s.kind==='poly')return pip(x,y,s.pts);return x>=s.x&&x<=s.x+s.w&&y>=s.y&&y<=s.y+s.h}
function center(s){const b=bbox(s);return[(b.x0+b.x1)/2,(b.y0+b.y1)/2]}
function labelPoint(s){
  if(s.kind!=='poly')return center(s);
  const p=s.pts,A=signedArea(p);let cx=0,cy=0;
  for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];const f=x1*y2-x2*y1;cx+=(x1+x2)*f;cy+=(y1+y2)*f}
  cx/=(6*A);cy/=(6*A);
  if(pip(cx,cy,p))return[cx,cy];
  // fallback: centre of the largest horizontal run through the middle rows
  const b=bbox(s);let best=null;
  for(let k=1;k<10;k++){const y=b.y0+b.h*k/10;const xs=[];for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];if((y1>y)!==(y2>y))xs.push(x1+(y-y1)*(x2-x1)/(y2-y1))}xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2){const w=xs[i+1]-xs[i];if(!best||w>best.w)best={w,x:(xs[i]+xs[i+1])/2,y}}}
  return best?[best.x,best.y]:center(s);
}
function parentOf(c){const[x,y]=center(c);const ps=pieces();for(let i=ps.length-1;i>=0;i--)if(contains(ps[i],x,y))return ps[i];return null}
function cutsOf(p){return cuts().filter(c=>{const[x,y]=center(c);return contains(p,x,y)&&parentOf(c)===p})}

/* ---------- calculations ---------- */
function calc(){
  const rows=pieces().map(p=>{
    const cs=cutsOf(p);const qty=Math.max(1,+p.qty||1);
    const unit=areaCm(p)/1e4;const cutA=cs.reduce((a,c)=>a+c.w*c.h,0)/1e4;
    const unitNet=S.discountCuts?Math.max(0,unit-cutA):unit;
    const b=bbox(p);
    return{p,qty,unit,m2:unitNet*qty,ml:linLen(p)/100*qty,cuts:cs,mat:matOf(p)};
  });
  const byType={},byMat={},cutCount={};
  for(const r of rows){
    const t=byType[r.p.type]||(byType[r.p.type]={type:r.p.type,n:0,m2:0,ml:0});t.n+=r.qty;t.m2+=r.m2;t.ml+=r.ml;
    const m=byMat[r.mat.id]||(byMat[r.mat.id]={mat:r.mat,n:0,m2:0});m.n+=r.qty;m.m2+=r.m2;
    for(const c of r.cuts){cutCount[c.name]=(cutCount[c.name]||0)+r.qty}
  }
  for(const c of cuts())if(!parentOf(c))cutCount[c.name+' (fora de peça)']=(cutCount[c.name+' (fora de peça)']||0)+1;
  const loss=1+(+S.lossPct||0)/100;
  const mats=Object.values(byMat).map(m=>({...m,m2l:m.m2*loss,sub:m.m2*loss*(+m.mat.price||0)}));
  const m2=rows.reduce((a,r)=>a+r.m2,0);
  const nCuts=Object.values(cutCount).reduce((a,b)=>a+b,0);
  const cutTotal=nCuts*(+S.cutPrice||0);
  const matTotal=mats.reduce((a,m)=>a+m.sub,0);
  return{rows,types:Object.values(byType).sort((a,b)=>TYPES.indexOf(a.type)-TYPES.indexOf(b.type)),mats,cutCount,nCuts,cutTotal,m2,m2l:m2*loss,matTotal,total:matTotal+cutTotal};
}

/* ---------- canvas ---------- */
const svg=$('#cv'),stage=$('#stage');
function lum(hex){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);const r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;return .2126*r+.7152*g+.0722*b}
/* label layout helpers (world cm; boxes are [x0,y0,x1,y1]) */
const DISP='"Onest",system-ui,sans-serif',MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';

/* ---------- snapping ---------- */

/* ---------- pointer ---------- */

  if(ex){pushUndo();S.shapes=S.shapes.filter(o=>o.id!==ex.id);renderAll();save();toast(`${kind} tirado do lado ${j+1}`);return}
  const custom=parseFloat(String(genLen).replace(',','.')),L=custom>0?r1(Math.min(custom,ed.len)):ed.len;
  const t=kind==='Saia'?(+S.saiaH||4):(+S.frontH||10);pushUndo();
  const base={id:uid(),parent:s.id,edge:i,name:`${kind} ${DIR_NAME[ed.dir].toLowerCase()} ${fcm(L)} — ${s.name}`,type:kind,material:s.material,qty:s.qty||1};
  let n;
  if(ed.dir==='a'){ // slanted edge: strip parallel to it, 4 cm off
    const g=4,[ax,ay]=ed.a,P=(u,v)=>[r1(ax+ed.ux*u+ed.nx*v),r1(ay+ed.uy*u+ed.ny*v)];
    n={...base,kind:'poly',pts:[P(0,g),P(L,g),P(L,g+t),P(0,g+t)]};
  }else{
    const d=ed.dir,sib=pieces().filter(o=>o.parent===s.id).map(o=>o.id);let x,y,w,h; // strips of the same piece may meet at the corners
    if(d==='t'||d==='b'){w=L;h=t;x=ed.from;y=d==='b'?placeBelow(x,w,h,ed.pos+4,sib):placeAbove(x,w,h,ed.pos-4-h,sib)}
    else{w=t;h=L;y=ed.from;x=d==='l'?placeSide(y,h,w,ed.pos-4-w,-1,sib):placeSide(y,h,w,ed.pos+4,1,sib)}
    n={...base,kind:'rect',x:r1(x),y:r1(y),w,h};
  }
  S.shapes.push(n);flashIds=[n.id];renderAll();save();reveal([s.id,n.id]);setTimeout(()=>{flashIds=[];renderCanvas()},2200);
  toast(`${kind} no lado ${j+1}: ${fcm(L)} × ${fcm(t)} cm`);
}

let pending=null;

function applyField(t){
  if(t.id==='m-mat'){if(!t.value)return;pushUndo();for(const id of multi){const x=byId(id);if(x&&x.kind!=='cut')x.material=t.value}renderAll();save();toast('Material trocado em '+multi.size+' itens');return}

  if(t.id==='f-genLen'){genLen=t.value;return}
  if(t.dataset.o){S[t.dataset.o]=+t.value;save();return}
  if(!s||!t.dataset.f)return;const f=t.dataset.f;
  if(f==='w'||f==='h'){const v=parseFloat(t.value);if(!(v>0))return;s[f]=r1(v)}
  else if(f==='qty'){const v=parseInt(t.value);if(!(v>=1))return;const old=+s.qty||1;s.qty=v;for(const k of pieces())if(k.parent===s.id&&(+k.qty||1)===old)k.qty=v}
  else if(f==='material'){s.material=t.value;for(const k of pieces())if(k.parent===s.id)k.material=t.value}
  else s[f]=t.value;
  renderCanvas();renderTop();renderMetrics();renderTab();save();
}

    el.innerHTML=`<div class="blk"><h3>Trocar a pedra do projeto</h3><div class="genlen" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink);font-size:13px"><select id="allMat" style="flex:1">${matOpts(S.defMat)}</select><button class="btn primary" id="allMatBtn">Aplicar em todas as peças</button></div></div>
    <div class="blk"><h3>Materiais e preço por m²</h3><div style="display:flex;flex-direction:column;gap:8px">
      ${S.materials.map(m=>`<div class="mat" data-m="${m.id}"><input id="mc-${m.id}" type="color" data-mf="color" value="${m.color}" aria-label="Cor"><input id="mn-${m.id}" type="text" data-mf="name" value="${esc(m.name)}" aria-label="Nome do material"><input id="mp-${m.id}" type="number" data-mf="price" min="0" step="10" value="${m.price}" aria-label="Preço por m²"><button class="x" data-rm="${m.id}" aria-label="Remover material">✕</button></div>`).join('')}
      </div><div class="actions"><button class="btn" id="addMat">+ Material</button></div>
      <p class="hint" style="margin-top:10px">Os preços do exemplo são ilustrativos — troque pelos da sua tabela.</p></div>`;
    $('#allMatBtn').onclick=()=>{const id=$('#allMat').value;pushUndo();for(const k of pieces())k.material=id;S.defMat=id;renderDefaults();renderAll();save();toast('Todas as peças agora em '+(S.materials.find(m=>m.id===id)?.name||''))};
    $('#addMat').onclick=()=>{pushUndo();S.materials.push({id:uid(),name:'Novo material',color:'#9C8F7E',price:0});renderAll();save()};
  }
}
const tb=$('#tabbody');
tb.addEventListener('focusin',e=>{if(e.target.matches('[data-o],[data-mf]'))pending=snapshot()});
tb.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.o){S[t.dataset.o]=t.type==='checkbox'?t.checked:+t.value;renderTop();renderCanvas();renderMetrics();save();return}
  if(t.dataset.mf){const m=S.materials.find(x=>x.id===t.closest('[data-m]').dataset.m);if(!m)return;m[t.dataset.mf]=t.dataset.mf==='price'?+t.value:t.value;renderTop();renderCanvas();renderDefaults();save()}
});
tb.addEventListener('change',e=>{if(pending){pushUndo(pending);pending=null}const t=e.target;if(t.dataset.mf){const m=S.materials.find(x=>x.id===t.closest('[data-m]').dataset.m);if(m){m[t.dataset.mf]=t.dataset.mf==='price'?+t.value:t.value;renderTop();renderCanvas();renderDefaults();save()}}if(t.dataset.o==='discountCuts'||t.dataset.o==='snap'){S[t.dataset.o]=t.type==='checkbox'?t.checked:+t.value;t.blur();renderTab();renderTop();save()}});
tb.addEventListener('focusout',e=>{setTimeout(()=>{if(!tb.contains(document.activeElement))renderTab()},0)});
tb.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){if(S.materials.length<=1){toast('Mantenha pelo menos um material');return}const used=pieces().some(s=>s.material===rm.dataset.rm);if(used){toast('Material em uso — troque as peças antes de remover');return}pushUndo();S.materials=S.materials.filter(m=>m.id!==rm.dataset.rm);renderAll();save();return}
  const row=e.target.closest('tr.row[data-id]');
  if(row){selId=row.dataset.id;multi.clear();const s=byId(selId);const[cx,cy]=center(s);view.x=cx-svg.clientWidth/2/view.scale;view.y=cy-svg.clientHeight/2/view.scale;renderAll()}
});

/* ---------- export ---------- */
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1800)}
async function copy(text,ok){
  try{await navigator.clipboard.writeText(text);toast(ok)}
  catch(e){const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);ta.select();let done=false;try{done=document.execCommand('copy')}catch(_){}ta.remove();toast(done?ok:'Não foi possível copiar')}
}
// piece size in plain words: "80 × 15 cm", "formato em L, 260 × 180 cm"
const sizeTxt=r=>{const z=sizeOf(r.p);return(z.f==='L/U'?'formato em L/U, ':z.f==='Inclinada'?'inclinada, ':'')+`${fcm(z.w)} × ${fcm(z.h)} cm`};
const plural=(n,w)=>n>1&&!/s$|\)$/.test(w)?w+'s':w;
// text for WhatsApp / e-mail: grouped by stone, *bold* titles, one line per piece
$('#copyTxt').onclick=()=>{
  const c=calc(),L=[`*Orçamento — ${S.name||'Projeto'}*`,new Date().toLocaleDateString('pt-BR')];
  for(const m of c.mats){
    L.push('',`*${m.mat.name}* (${money(m.mat.price)} o m²)`);
    for(const r of c.rows.filter(r=>r.mat.id===m.mat.id))L.push(`• ${r.p.name}: ${r.qty>1?r.qty+' peças de ':''}${sizeTxt(r)} = ${f2(r.m2)} m²`);
    L.push(`Subtotal: ${f2(m.m2l)} m² = ${money(m.sub)}`);
  }
  if(c.nCuts){L.push('','*Recortes*');for(const[n,q]of Object.entries(c.cutCount))L.push(`• ${q} ${plural(q,n).toLowerCase()} = ${money(q*(+S.cutPrice||0))}`)}
  L.push('',`*Total: ${money(c.total)}*`,`${f2(c.m2l)} m² de pedra${c.nCuts?` e ${c.nCuts} recorte${c.nCuts>1?'s':''}`:''}${+S.lossPct?` (inclui ${fcm(S.lossPct)}% de perda)`:''}`);
  copy(L.join('\n'),'Orçamento copiado — cole no WhatsApp ou e-mail');
};
// spreadsheet: one row per piece, then cutouts and the total
$('#copyCsv').onclick=()=>{
  const c=calc(),q=v=>`"${String(v).replace(/"/g,'""')}"`,row=a=>a.map(q).join(';'),loss=1+(+S.lossPct||0)/100;
  const L=[row(['Peça','Tipo','Pedra','Formato','Comprimento (cm)','Largura (cm)','Quantidade','Recortes','Área (m²)','Preço do m² (R$)','Valor (R$)'])];
  for(const r of c.rows){const z=sizeOf(r.p);L.push(row([r.p.name,r.p.type,r.mat.name,z.f,fcm(z.w),fcm(z.h),r.qty,r.cuts.map(x=>x.name).join(' + '),f2(r.m2),f2(r.mat.price),f2(r.m2*loss*(+r.mat.price||0))]))}
  for(const[n,k]of Object.entries(c.cutCount))L.push(row(['Recorte: '+n,'','','','','',k,'','',f2(+S.cutPrice||0),f2(k*(+S.cutPrice||0))]));
  L.push(row(['Total','','','','','','','',f2(c.m2l),'',f2(c.total)]));
  copy(L.join('\n'),'Planilha copiada — cole no Excel ou Planilhas');
};
// switch to another saved budget (the current one is saved first)
function openProj(b){
  let o;try{o=typeof b.estado==='string'?JSON.parse(b.estado):b.estado}catch(e){}
  if(!o||!o.shapes||!o.materials){toast('Arquivo inválido — não é um orçamento da Prancheta');return false}
  flush();S=o;if(!S.id)S.id=b.id||uid();undoStack=[];selId=null;multi.clear();renderDefaults();renderAll();fit();save();toast('Aberto: '+(S.name||'Sem nome'));return true;
}
function newProj(){
  flush();const k=S;
  S={...sample(),id:uid(),name:'',tel:'',end:'',shapes:[],materials:k.materials,defMat:k.materials[0]?.id,lossPct:k.lossPct,cutPrice:k.cutPrice,snap:k.snap,saiaH:k.saiaH,frontH:k.frontH,angStep:k.angStep};
  undoStack=[];selId=null;multi.clear();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  renderDefaults();renderAll();fit();toast('Novo orçamento — o anterior ficou salvo em Clientes');$('#projName').focus();
}
async function delProj(id){
  const l=localList();delete l[id];try{localStorage.setItem(LKEY,JSON.stringify(l))}catch(e){}
  if(db)cloudQ=cloudQ.then(()=>db.doc('orcamentos/'+id).delete()).catch(()=>{});
  if(cloud)cloud=cloud.filter(b=>b.id!==id);
  if(id===S.id)newProj();else renderLista();
}
let dl=null;window.claude?.use?.('downloads').then(d=>{dl=d});
async function saveFile(name,text){
  const filename=name.replace(/[\\/:*?"<>|]+/g,'-').slice(0,120)+'.json';
  if(dl){try{await dl.save({filename,data:text});toast('Arquivo salvo')}catch(e){if(e.code!=='declined')toast('Não foi possível salvar o arquivo')}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
const today=()=>new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
const picker=Object.assign(document.createElement('input'),{type:'file',accept:'.json,application/json',hidden:true});document.body.append(picker);
picker.onchange=async()=>{const f=picker.files[0];picker.value='';if(!f)return;let o;try{o=JSON.parse(await f.text())}catch(e){toast('Arquivo inválido — não é um orçamento da Prancheta');return}
  if(Array.isArray(o.orcamentos)){const l=localList();let n=0;for(const b of o.orcamentos){if(!b||!b.id||!b.estado)continue;l[b.id]=b;pushCloud(b.id,b);n++}try{localStorage.setItem(LKEY,JSON.stringify(l))}catch(e){}renderLista();toast(n+' orçamentos restaurados');return}
  openProj(o);};
$('#tabbody').addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#c-new'))return newProj();
  if(t.closest('#c-save')){flush();return saveFile('Orçamento '+(S.name||'sem nome')+' '+today(),JSON.stringify({app:'prancheta',id:S.id,...body()}))}
  if(t.closest('#c-open'))return picker.click();
  if(t.closest('#c-all'))return saveFile('Prancheta backup '+today(),JSON.stringify({app:'prancheta',orcamentos:lista()}));
  const d=t.closest('[data-delp]');if(d){const id=d.dataset.delp;if(delArm!==id){delArm=id;renderLista();setTimeout(()=>{if(delArm===id){delArm='';renderLista()}},3000)}else{delArm='';delProj(id)}return}
  const r=t.closest('[data-open]');if(r&&r.dataset.open!==S.id){const b=lista().find(x=>x.id===r.dataset.open);if(b)openProj(b)}
});
$('#tabbody').addEventListener('input',e=>{
  const t=e.target;if(t.id==='c-busca'){busca=t.value;renderLista();return}
  if(t.dataset.c){S[t.dataset.c]=t.value;if(t.dataset.c==='name')$('#projName').value=t.value;save()}
});

$('#newProj').onclick=newProj;

/* ---------- mobile sheet ---------- */
const side=$('#side'),toolsEl=document.querySelector('.tools');
function sheetHeights(){const H=document.querySelector('.main').clientHeight-(toolsEl.offsetHeight||62);return{peek:58,half:Math.round(H*.46),full:Math.round(H-8)}}
function focusSel(){const s=byId(selId);if(!s)return;const[cx,cy]=center(s);const vis=svg.clientHeight-sheetHeights().half+ (toolsEl.offsetHeight||0);const vh=Math.max(120,svg.clientHeight-(sheetHeights().half-0));
  view.x=cx-svg.clientWidth/2/view.scale;view.y=cy-(Math.max(80,vh/2+30))/view.scale;renderCanvas()}
function setSheet(st){sheet=st;applySheet()}
function applySheet(){
  if(!isMob()){side.style.removeProperty('--sheetH');return}
  side.style.setProperty('--toolsH',toolsEl.offsetHeight+'px');
  side.style.setProperty('--sheetH',sheetHeights()[sheet]+'px');
  if(sheet==='peek')side.scrollTop=0;
}
let sh=null;
const head=$('#sheetHead');
head.addEventListener('pointerdown',e=>{sh={y:e.clientY,h:side.offsetHeight};head.setPointerCapture(e.pointerId);side.style.transition='none'});
head.addEventListener('pointermove',e=>{if(!sh)return;const hs=sheetHeights();const h=Math.max(hs.peek,Math.min(hs.full,sh.h-(e.clientY-sh.y)));side.style.setProperty('--sheetH',h+'px')});
head.addEventListener('pointerup',e=>{if(!sh)return;side.style.transition='';const dy=e.clientY-sh.y;const order=['peek','half','full'];let i=order.indexOf(sheet);
  if(Math.abs(dy)<6){i=sheet==='peek'?1:0}else{const h=side.offsetHeight,hs=sheetHeights();i=order.reduce((b,k,j)=>Math.abs(hs[k]-h)<Math.abs(hs[order[b]]-h)?j:b,0);if(dy<-40&&i<=order.indexOf(sheet))i=Math.min(2,order.indexOf(sheet)+1);if(dy>40&&i>=order.indexOf(sheet))i=Math.max(0,order.indexOf(sheet)-1)}
  sh=null;setSheet(order[i])});
head.addEventListener('pointercancel',()=>{sh=null;side.style.transition='';applySheet()});
function placeDefs(){const nd=$('#newdef');const target=isMob()?$('#mobDefs'):document.querySelector('.top .totals');if(isMob()){if(nd.parentElement!==target)target.appendChild(nd)}else if(nd.parentElement!==document.querySelector('.top'))document.querySelector('.top').insertBefore(nd,target);applySheet();renderHud()}
mqM.addEventListener('change',placeDefs);
window.addEventListener('resize',applySheet);

/* ---------- polygon pad ---------- */
$('#polyPad').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ang!=null){S.angStep=+b.dataset.ang;save();draft.cursor=null;snapGuide=null;renderCanvas();toast(S.angStep?`Lados travados a cada ${S.angStep}°`:'Ângulo livre');return}
  if(b.dataset.pp==='close'){closePoly();return}
  if(b.dataset.pp==='undo'){draft.pts.pop();draft.cursor=null;renderCanvas();return}
  const d=b.dataset.d;const inp=$('#pp-len');const len=parseFloat(String(inp.value).replace(',','.'));
  if(!(len>0)){toast('Digite a medida do lado em cm');inp.focus();return}
  const l=draft.pts[draft.pts.length-1];const h=Math.SQRT1_2,v={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1],ul:[-h,-h],ur:[h,-h],dl:[-h,h],dr:[h,h]}[d];
  draft.pts.push([r1(l[0]+v[0]*len),r1(l[1]+v[1]*len)]);draft.cursor=null;inp.value='';renderCanvas();
});
$('#pp-len').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value;if(v){draft.typed=String(v).replace('.',',');placeTyped();e.target.value=''}}});

function renderAll(){renderCanvas();renderTop();renderInspector();renderTab()}
new ResizeObserver(()=>renderCanvas()).observe(stage);
renderDefaults();placeDefs();renderAll();requestAnimationFrame(()=>{applySheet();fit()});
document.fonts?.ready.then(()=>{twCache.clear();renderCanvas()});
})();
</script>
